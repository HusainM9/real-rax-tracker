name: Marketplace monitor

on:
  schedule:
    # GitHub limits each individual schedule to five-minute-or-longer spacing.
    # Three six-minute schedules are staggered to cover every two minutes.
    - cron: '0-59/6 * * * *'
    - cron: '2-59/6 * * * *'
    - cron: '4-59/6 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: marketplace-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger marketplace scan
        env:
          MARKETPLACE_SCAN_SECRET: ${{ secrets.MARKETPLACE_SCAN_SECRET }}
        shell: bash
        run: |
          if [[ -z "$MARKETPLACE_SCAN_SECRET" ]]; then
            echo "::error::MARKETPLACE_SCAN_SECRET is not configured."
            exit 1
          fi

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --max-time 55 \
            --request POST \
            --header "Authorization: Bearer $MARKETPLACE_SCAN_SECRET" \
            --header "Content-Type: application/json" \
            "https://real-rax-tracker.vercel.app/api/cron/marketplace-alerts"
