name: Earnings snapshot fallback

on:
  schedule:
    # Vercel Hobby cron has hourly precision and can miss the intended 4:30 AM
    # Eastern start. These independent retries cover 4:35-6:55 AM across EDT
    # and EST; the endpoint rejects calls outside its Eastern recovery window.
    - cron: '35 8-11 * * *'
    - cron: '55 8-11 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: earnings-snapshot-fallback
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger earnings snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::CRON_SECRET is not configured in GitHub Actions."
            exit 1
          fi

          # Alternate list direction so a rate-limited run cannot repeatedly
          # starve accounts at the same end of the linked-account list.
          if [[ "${{ github.event.schedule }}" == 55\ * ]]; then
            route="snapshot-earnings-final-check"
          else
            route="snapshot-earnings-fallback"
          fi

          query=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            route="snapshot-earnings"
            query="?test=1"
          fi

          status=$(curl \
            --silent \
            --show-error \
            --max-time 290 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --output response.json \
            --write-out '%{http_code}' \
            "https://real-rax-tracker.vercel.app/api/cron/$route$query")

          cat response.json
          if [[ "$status" != 2* ]]; then
            echo "::error::Earnings endpoint returned HTTP $status."
            exit 1
          fi
          jq --exit-status '.ok == true' response.json >/dev/null
